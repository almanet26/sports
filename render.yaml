services:
  - type: web
    name: sports-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://sports-teal-two.vercel.app
      - key: CLOUD_RUN
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: sports-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
